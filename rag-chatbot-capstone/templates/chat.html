<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Document Q&amp;A Assistant</h1>
            <p>Ask questions about your uploaded knowledge base — answers are grounded in retrieved context.</p>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                Hi! Ask me anything about the documents I've been given.
            </div>
        </div>
        <form class="chat-input" id="chat-form">
            <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
